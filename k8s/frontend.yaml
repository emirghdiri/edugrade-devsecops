# Frontend Nginx non-root (UID 101) : reverse proxy vers le backend, en-têtes
# de sécurité (Bonus 1). La configuration vient de docker/nginx.conf
# (ConfigMap nginx-conf créée par scripts/k8s_deploy.sh).
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: edugrade }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: frontend }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: edugrade }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: frontend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: edugrade }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.29-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /nginx-health, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /nginx-health, port: 8080 }
            periodSeconds: 15
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/conf.d, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: conf
          configMap:
            name: nginx-conf
        - { name: tmp, emptyDir: {} }
---
# Point d'entrée : Traefik (k3s) -> frontend:8080, http://edugrade.localhost
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edugrade
  labels: { app.kubernetes.io/part-of: edugrade }
spec:
  ingressClassName: traefik
  rules:
    - host: edugrade.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 8080 }
