{% extends "base.html" %}
{% set title = "Ajouter une note" if mode == "new" else "Modifier une note" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="card" style="max-width: 640px">
  <h1>{{ title }}</h1>
  <p class="muted">Étudiant : <strong>{{ student.name }}</strong></p>

  <form method="post" class="form"
        action="{{ url_for('teacher.new_grade', student_id=student.id) if mode == 'new' else url_for('teacher.edit_grade', grade_id=grade.id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if mode == "new" %}<input type="hidden" name="student_id" value="{{ student.id }}">{% endif %}

    <label for="subject">Matière</label>
    <select id="subject" name="subject" required>
      <option value="">— Choisir —</option>
      {% for s in config.SUBJECTS %}
        <option value="{{ s }}" {{ 'selected' if s == grade.subject }}>{{ s }}</option>
      {% endfor %}
    </select>

    <div class="form-row">
      <div>
        <label for="value">Note (sur 20)</label>
        <input id="value" name="value" type="number" min="0" max="20" step="0.25" value="{{ grade.value if grade.value is not none }}" required>
      </div>
      <div>
        <label for="date">Date</label>
        <input id="date" name="date" type="date" value="{{ grade.date.isoformat() if grade.date else '' }}" required>
      </div>
    </div>

    <div>
      <button type="submit" class="btn btn-primary">Enregistrer</button>
      <a class="btn" href="{{ url_for('student.grades', student_id=student.id) }}">Annuler</a>
    </div>
  </form>
</section>
{% endblock %}
