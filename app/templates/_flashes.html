{% import "_ui.html" as ui with context %}
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
    <div class="alert alert-{{ category }}" role="{{ 'alert' if category == 'error' else 'status' }}">
      {{ ui.icon({"error": "alert", "success": "check"}.get(category, "info")) }}
      <span>{{ message }}</span>
    </div>
  {% endfor %}
{% endwith %}
