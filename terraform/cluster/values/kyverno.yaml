# Kyverno : une réplique par contrôleur (cluster mono-nœud de démonstration).

# Kyverno 1.20 n'exécute plus les anciennes ClusterPolicy (kyverno.io/v1) :
# les règles EduGrade utilisent les types policies.kyverno.io (ValidatingPolicy,
# ImageValidatingPolicy, CEL). Le cluster ne contient aucune ancienne règle :
# le job de vérification préalable (image kyverno-cli) est inutile.
upgrade:
  legacyPolicyCheck:
    enabled: false

admissionController:
  replicas: 1
  container:
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { memory: 384Mi }
backgroundController:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
cleanupController:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }
reportsController:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
