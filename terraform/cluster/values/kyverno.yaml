# Kyverno : une réplique par contrôleur (cluster mono-nœud de démonstration).
admissionController:
  replicas: 1
  container:
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { memory: 384Mi }
backgroundController:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
cleanupController:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }
reportsController:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
