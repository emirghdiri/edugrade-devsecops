# Alloy (Deployment, 1 réplique) : lit les journaux des pods du namespace
# edugrade par l'API Kubernetes (loki.source.kubernetes), sans hostPath ni
# privilège, extrait les champs JSON utiles et les envoie à Loki.
controller:
  type: deployment
  replicas: 1

alloy:
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { memory: 256Mi }
  mounts:
    varlog: false
  configMap:
    create: true
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
        namespaces {
          names = ["edugrade"]
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.edugrade.receiver]
      }

      // Journaux JSON du backend : « event » et « level » deviennent des
      // labels (cardinalité faible) ; le reste reste dans la ligne.
      loki.process "edugrade" {
        stage.json {
          expressions = { event = "event", level = "level" }
        }
        stage.labels {
          values = { event = "", level = "" }
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
