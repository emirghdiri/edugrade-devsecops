# Durcissement des pods du namespace edugrade (complète la Pod Security
# Admission « restricted » posée par Terraform). Règles CEL (Kyverno 1.20),
# appliquées aussi aux Deployment/StatefulSet (autogen).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: edugrade-pod-security
  annotations:
    policies.kyverno.io/title: Durcissement des pods EduGrade
    policies.kyverno.io/severity: high
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: edugrade
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: containers
      expression: "object.spec.containers + object.spec.?initContainers.orValue([])"
  validations:
    - message: "Image refusée : seules l'image EduGrade (ghcr.io/emirghdiri/edugrade-*), postgres:16-alpine et nginxinc/nginx-unprivileged:1.29-alpine sont autorisées."
      expression: >-
        variables.containers.all(c,
          c.image.startsWith('ghcr.io/emirghdiri/edugrade-') ||
          c.image.startsWith('postgres:16-alpine') ||
          c.image.startsWith('docker.io/library/postgres:16-alpine') ||
          c.image.startsWith('nginxinc/nginx-unprivileged:1.29-alpine') ||
          c.image.startsWith('docker.io/nginxinc/nginx-unprivileged:1.29-alpine'))
    - message: "Image refusée : un tag explicite ou un digest est obligatoire."
      expression: "variables.containers.all(c, c.image.matches(':[^/]+$'))"
    - message: "Image refusée : le tag « latest » est interdit (image non reproductible)."
      expression: "variables.containers.all(c, !c.image.endsWith(':latest'))"
    - message: "Pod refusé : runAsNonRoot: true est obligatoire (pod ou chaque conteneur)."
      expression: >-
        variables.containers.all(c,
          c.?securityContext.?runAsNonRoot.orValue(
            object.spec.?securityContext.?runAsNonRoot.orValue(false)) == true)
    - message: "Pod refusé : privileged et allowPrivilegeEscalation sont interdits."
      expression: >-
        variables.containers.all(c,
          c.?securityContext.?privileged.orValue(false) == false &&
          c.?securityContext.?allowPrivilegeEscalation.orValue(true) == false)
