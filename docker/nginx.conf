# Reverse proxy Nginx devant le backend Flask (image nginxinc/nginx-unprivileged,
# exécutée en non-root, écoute sur 8080).
#
# VULN-B1 (volontaire, voir docs/VULNERABILITES.md) : aucun en-tête de sécurité
# (Content-Security-Policy, X-Frame-Options, X-Content-Type-Options,
# Referrer-Policy) n'est ajouté aux réponses.

upstream edugrade_backend {
    server backend:8000;
}

server {
    listen 8080;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    location / {
        proxy_pass http://edugrade_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_read_timeout 30s;
    }

    # Sonde de santé du proxy lui-même (ne touche pas le backend).
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
