# Reverse proxy Nginx devant le backend Flask (image nginxinc/nginx-unprivileged,
# exécutée en non-root, écoute sur 8080).
#
# Correctif Bonus 1 : en-têtes de sécurité ajoutés à TOUTES les réponses
# (« always » : y compris 4xx/5xx). Ils sont déclarés au niveau server et
# hérités par les location qui n'ont pas leur propre add_header.
# L'interface n'a ni JavaScript, ni style en ligne, ni ressource externe :
# la CSP peut donc être stricte. HSTS est posé là où TLS est terminé (Ingress),
# pas sur ce port HTTP local.

upstream edugrade_backend {
    server backend:8000;
}

server {
    listen 8080;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    location / {
        proxy_pass http://edugrade_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_read_timeout 30s;
    }

    # Sonde de santé du proxy lui-même (ne touche pas le backend).
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
